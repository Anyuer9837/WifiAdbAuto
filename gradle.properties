# Project-wide Gradle settings.

# 使用 AndroidX（本项目依赖 androidx.appcompat / material，必须开启）
android.useAndroidX=true
# 所有依赖都已是 AndroidX，无需 Jetifier，关闭可加快构建
android.enableJetifier=false

# AGP 8.1 官方要求 JDK 17；用 JDK 21 会导致 jlink（androidJdkImage）失败
org.gradle.java.home=/Users/yuerlv/Library/Java/JavaVirtualMachines/jbr-17.0.14/Contents/Home

# Gradle 守护进程 JVM 参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 开启配置缓存与并行构建（可选，加快构建速度）
org.gradle.parallel=true
org.gradle.caching=true
